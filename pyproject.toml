[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lunar-mining-sim"
version = "0.1.0"
description = "Discrete-event simulation of a lunar Helium-3 mining operation."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Michael" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",                     # test runner
    "ruff>=0.6",                     # linter + formatter
    "mypy>=1.10",                    # static type checker (works off your type hints)
]

[project.scripts]
mining-sim = "mining_sim.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_ignores = true